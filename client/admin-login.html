<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Na-Dee — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/desktop.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body data-page="admin-login">

<div class="app-shell no-bottom-nav">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-pill"><span class="dot"></span> <span data-i18n="brand">นาดี</span></span>
      <span class="role-pill admin-role"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg><span data-i18n="admin_role">ผู้ดูแล</span></span>
    </div>
    <div class="topbar-right">

      <button class="lang-toggle" id="langToggleBtn">ไทย / EN</button>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1 data-i18n="login_title">เข้าสู่ระบบผู้ดูแล</h1>
    <p data-i18n="login_subtitle">สำหรับผู้จัดการข้อมูล</p>

    <form id="loginForm" class="login-form" novalidate>
      <p id="loginError" class="login-error" data-i18n="login_error">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>

      <div class="field">
        <label for="emailInput" data-i18n="login_email">อีเมล</label>
        <input type="email" id="emailInput" placeholder="admin@example.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="passwordInput" data-i18n="login_password">รหัสผ่าน</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn-cta" id="loginBtn"><span data-i18n="login_button">เข้าสู่ระบบ</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </form>

    <p class="login-back-wrap">
      <a href="index.html" class="login-back-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-i18n="login_back">กลับหน้าแรก</span></a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
