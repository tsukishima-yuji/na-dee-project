<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Na-Dee — Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/desktop.css" />
</head>
<body data-page="admin">

<div class="app-shell">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-pill"><span class="dot"></span> <span data-i18n="brand">นาดี</span></span>
      <span class="role-pill" data-i18n="role_farmer">เกษตรกร</span>
    </div>
    <div class="topbar-right">
      <button class="pill-btn" id="logoutBtn" data-i18n="admin_logout">ออกจากระบบ</button>
      <button class="lang-toggle" id="langToggleBtn">ไทย / EN</button>
    </div>
  </header>

  <div class="admin-header">
    <h1 data-i18n="admin_all_scenarios">Scenario ทั้งหมด</h1>
    <button class="btn-add" id="addScenarioBtn">+ <span data-i18n="admin_add">เพิ่ม</span></button>
  </div>

  <!-- Scenario list, filled in by admin-dashboard.js -->
  <section class="scenario-list" id="scenarioList"></section>

  <h2 class="summary-title" data-i18n="admin_summary_title">สรุประบบ</h2>
  <section class="stats-row">
    <div class="stat-box">
      <div class="stat-number" id="summaryScenarioCount">0</div>
      <div class="stat-label" data-i18n="admin_summary_scenario">Scenario</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="summaryProvinceCount">0</div>
      <div class="stat-label" data-i18n="admin_summary_province">จังหวัด</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="summaryCropCount">0</div>
      <div class="stat-label" data-i18n="admin_summary_crop">พันธุ์</div>
    </div>
  </section>
</div>

<nav class="bottom-nav admin-nav">
  <button class="nav-icon-btn" aria-label="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
  </button>
</nav>


<!-- ===== Add / Edit scenario modal ===== -->
<div class="modal-overlay hidden" id="scenarioModalOverlay">
  <div class="modal-sheet">
    <h2 class="modal-title" id="scenarioModalTitle">เพิ่ม Scenario ใหม่</h2>
    <form id="scenarioForm" novalidate>
      <!-- ---- Basic info ---- -->
      <div class="modal-section" data-i18n="modal_section_info">ข้อมูลทั่วไป</div>
      <div class="field">
        <label data-i18n="modal_name_label">ชื่อ Scenario</label>
        <input type="text" id="nameThInput" data-i18n-placeholder="modal_name_placeholder" placeholder="เช่น เกษตรกรรายย่อย — พึ่งน้ำฝน" required />
      </div>
      <div class="field">
        <label data-i18n="modal_name_en_label">ชื่อภาษาอังกฤษ</label>
        <input type="text" id="nameEnInput" placeholder="e.g. Smallholder — Rain-fed" />
      </div>
      <div class="field">
        <label data-i18n="modal_description_label">คำอธิบาย</label>
        <textarea id="descriptionInput" rows="2"></textarea>
      </div>
      <div class="field">
        <label data-i18n="modal_province_label">จังหวัด</label>
        <select id="provinceInput" required>
          <option value="khon_kaen" data-i18n="form_province_kk">ขอนแก่น</option>
          <option value="udon_thani" data-i18n="form_province_ud">อุดรธานี</option>
        </select>
      </div>

      <!-- ---- Matching conditions (compared with the farmer's form) ---- -->
      <div class="modal-section" data-i18n="modal_section_match">เงื่อนไขการจับคู่</div>
      <div class="field">
        <label data-i18n="modal_variety_label">พันธุ์ (คั่นด้วย , )</label>
        <input type="text" id="varietyInput" placeholder="ห้วยบง 80, ระยอง 11" />
      </div>
      <div class="field-row">
        <div class="field">
          <label data-i18n="form_planting_date">วันปลูก</label>
          <select id="plantingInput">
            <option value="early" data-i18n="form_planting_early">ต้นฤดูฝน (พ.ค.-มิ.ย.)</option>
            <option value="late" data-i18n="form_planting_late">ปลายฤดูฝน (ต.ค.-พ.ย.)</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="form_irrigation">การให้น้ำ</label>
          <select id="irrigationInput">
            <option value="rain_fed" data-i18n="form_irrigation_rain">อาศัยน้ำฝน (ไม่ให้น้ำเพิ่ม)</option>
            <option value="system" data-i18n="form_irrigation_system">ให้น้ำตามคำแนะนำระบบ</option>
          </select>
        </div>
      </div>

      <!-- ---- Outputs shown to the farmer ---- -->
      <div class="modal-section" data-i18n="modal_section_output">ผลลัพธ์ / คำแนะนำ</div>
      <div class="field-row">
        <div class="field">
          <label data-i18n="modal_yield_label">ผลผลิต (ตัน/ไร่)</label>
          <input type="number" id="yieldInput" min="0" step="0.1" placeholder="12.0" />
        </div>
        <div class="field">
          <label data-i18n="modal_water_label">น้ำ (ลบ.ม./ไร่/สัปดาห์)</label>
          <input type="number" id="waterInput" min="0" step="0.1" data-i18n-placeholder="modal_water_placeholder" placeholder="เช่น 14" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label data-i18n="modal_wue_label">WUE (กก./ลบ.ม.)</label>
          <input type="number" id="wueInput" min="0" step="0.1" placeholder="7.5" />
        </div>
        <div class="field">
          <label data-i18n="modal_n_label">ปุ๋ยไนโตรเจน</label>
          <input type="text" id="nFertilizerInput" placeholder="14.4 กก.N/ไร่" />
        </div>
      </div>
      <div class="field">
        <label data-i18n="modal_frequency_label">ความถี่การให้น้ำ</label>
        <input type="text" id="frequencyInput" data-i18n-placeholder="modal_frequency_placeholder" placeholder="เช่น ครั้งละ 24 ลบ.ม./ไร่ ทุก 12 วัน" />
      </div>
      <div class="field">
        <label data-i18n="modal_schedule_label">ตารางให้น้ำรายสัปดาห์</label>
        <textarea id="scheduleInput" rows="2"></textarea>
      </div>
      <div class="field">
        <label data-i18n="modal_source_label">แหล่งอ้างอิงข้อมูล</label>
        <textarea id="sourceInput" rows="2"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelModalBtn" data-i18n="modal_cancel">ยกเลิก</button>
        <button type="submit" class="btn-primary" data-i18n="modal_save">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Delete confirm modal ===== -->
<div class="modal-overlay hidden" id="deleteModalOverlay">
  <div class="modal-sheet">
    <h2 class="modal-title" data-i18n="modal_delete_title">ยืนยันการลบ Scenario</h2>
    <p id="deleteModalBody" style="color:var(--color-text-muted); font-size:14px; margin-bottom:18px;"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cancelDeleteBtn" data-i18n="modal_cancel">ยกเลิก</button>
      <button type="button" class="btn-danger" id="confirmDeleteBtn" data-i18n="modal_delete_confirm">ลบ Scenario</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
