<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Na-Dee — Input Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/input-form.css" />
<link rel="stylesheet" href="css/desktop.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body data-page="input">

<div class="app-shell">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-pill"><span class="dot"></span> <span data-i18n="brand">นาดี</span></span>
      <span class="role-pill"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span data-i18n="role_farmer">เกษตรกร</span></span>
    </div>
    <div class="topbar-right">
      <button class="pill-btn" id="adminEntryBtn" data-i18n="admin_btn">ผู้ดูแล</button>
      <button class="lang-toggle" id="langToggleBtn">ไทย / EN</button>
    </div>
  </header>

  <div class="form-header">
    <h1 data-i18n="form_title">ข้อมูลแปลงของคุณ</h1>
  </div>

  <form id="fieldForm" class="form-wrap form-card" novalidate>

    <!-- Fixed production area (replaces the province choice) -->
    <div class="area-note"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span data-i18n="form_area_fixed">พื้นที่ผลิตมันสำปะหลัง (ขอนแก่น)</span></div>

    <!-- Variety -->
    <div class="field">
      <label for="varietyInput" data-i18n="form_variety">พันธุ์มันสำปะหลัง</label>
      <div class="select-wrap">
        <select id="varietyInput">
          <option value="" disabled selected data-i18n="form_variety_placeholder">เลือกพันธุ์</option>
          <option value="KU50" data-i18n="variety_KU50">เกษตรศาสตร์ 50</option>
          <option value="RY9" data-i18n="variety_RY9">ระยอง 9</option>
          <option value="RY11" data-i18n="variety_RY11">ระยอง 11</option>
          <option value="CMR38" data-i18n="variety_CMR38">CMR38-125-77</option>
        </select>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Field size -->
    <div class="field">
      <label for="cultivatedArea" data-i18n="form_area">ขนาดพื้นที่เพาะปลูก (ไร่)</label>
      <div class="input-suffix">
        <input type="number" id="cultivatedArea" min="0" step="0.1" inputmode="decimal" data-i18n-placeholder="form_area_placeholder" placeholder="เช่น 8" />
        <span data-i18n="form_area_suffix">ไร่</span>
      </div>
      <p class="field-error" data-i18n="form_error_number">กรุณากรอกตัวเลขที่มากกว่า 0</p>
    </div>

    <!-- Planting date -->
    <div class="field">
      <label data-i18n="form_planting_date">วันปลูก</label>
      <div class="choice-group" id="plantingGroup">
        <button type="button" class="choice-pill" data-value="early"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span data-i18n="form_planting_early">ต้นฤดูฝน (พ.ค.-มิ.ย.)</span></button>
        <button type="button" class="choice-pill" data-value="late"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span data-i18n="form_planting_late">ปลายฤดูฝน (ต.ค.-พ.ย.)</span></button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Irrigation -->
    <div class="field">
      <label data-i18n="form_irrigation">การให้น้ำ</label>
      <div class="choice-group" id="irrigationGroup">
        <button type="button" class="choice-pill" data-value="rain_fed"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg><span data-i18n="form_irrigation_rain">อาศัยน้ำฝน (ไม่ให้น้ำเพิ่ม)</span></button>
        <button type="button" class="choice-pill" data-value="system"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg><span data-i18n="form_irrigation_system">ให้น้ำตามคำแนะนำระบบ</span></button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Nitrogen fertilizer -->
    <div class="field">
      <label data-i18n="form_nitrogen">ปุ๋ยไนโตรเจน</label>
      <div class="choice-group" id="nitrogenGroup">
        <button type="button" class="choice-pill" data-value="applied"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg><span data-i18n="form_nitrogen_applied">ใส่ปุ๋ย</span></button>
        <button type="button" class="choice-pill" data-value="not_applied"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><span data-i18n="form_nitrogen_not_applied">ไม่ใส่ปุ๋ย</span></button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <div class="form-footer">
      <button type="submit" class="btn-cta" id="submitBtn"><span data-i18n="form_next">ต่อไป</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </div>
  </form>
</div>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="input" href="input-form.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span data-i18n="nav_input">กรอกข้อมูล</span></a>
  <a class="nav-item" data-nav="compare" href="compare.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg><span data-i18n="nav_compare">เปรียบเทียบ</span></a>
  <a class="nav-item" data-nav="result" href="result.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span data-i18n="nav_admin">ผลลัพธ์</span></a>
</nav>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/input-form.js"></script>
</body>
</html>
