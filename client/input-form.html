<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Na-Dee — Input Form</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/input-form.css" />
<link rel="stylesheet" href="css/desktop.css" />
</head>
<body data-page="input">

<div class="app-shell">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-pill"><span class="dot"></span> <span data-i18n="brand">นาดี</span></span>
      <span class="role-pill" data-i18n="role_farmer">เกษตรกร</span>
    </div>
    <div class="topbar-right">
      <button class="pill-btn" id="adminEntryBtn" data-i18n="admin_btn">ผู้ดูแล</button>
      <button class="lang-toggle" id="langToggleBtn">ไทย / EN</button>
    </div>
  </header>

  <div class="form-header">
    <h1 data-i18n="form_title">ข้อมูลแปลงของคุณ</h1>
  </div>

  <form id="fieldForm" class="form-wrap" novalidate>

    <!-- Province -->
    <div class="field">
      <label data-i18n="form_province">จังหวัด</label>
      <div class="choice-group" id="provinceGroup">
        <button type="button" class="choice-pill selected" data-value="khon_kaen" data-i18n="form_province_kk">ขอนแก่น</button>
        <button type="button" class="choice-pill" data-value="udon_thani" data-i18n="form_province_ud">อุดรธานี</button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Variety -->
    <div class="field">
      <label data-i18n="form_variety">พันธุ์มันสำปะหลัง</label>
      <input type="text" id="varietyInput" data-i18n-placeholder="form_variety_placeholder" placeholder="ห้วยบง 80" />
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Planting date -->
    <div class="field">
      <label data-i18n="form_planting_date">วันปลูก</label>
      <div class="choice-group" id="plantingGroup">
        <button type="button" class="choice-pill" data-value="early" data-i18n="form_planting_early">ต้นฤดูฝน (พ.ค.-มิ.ย.)</button>
        <button type="button" class="choice-pill" data-value="late" data-i18n="form_planting_late">ปลายฤดูฝน (ต.ค.-พ.ย.)</button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Irrigation -->
    <div class="field">
      <label data-i18n="form_irrigation">การให้น้ำ</label>
      <div class="choice-group" id="irrigationGroup">
        <button type="button" class="choice-pill" data-value="rain_fed" data-i18n="form_irrigation_rain">อาศัยน้ำฝน (ไม่ให้น้ำเพิ่ม)</button>
        <button type="button" class="choice-pill" data-value="system" data-i18n="form_irrigation_system">ให้น้ำตามคำแนะนำระบบ</button>
      </div>
      <p class="field-error" data-i18n="form_error_required">กรุณากรอกข้อมูลนี้</p>
    </div>

    <!-- Cultivated area -->
    <div class="field">
      <label data-i18n="form_area">ขนาดพื้นที่เพาะปลูก (ไร่)</label>
      <input type="number" id="cultivatedArea" min="0" step="0.1" data-i18n-placeholder="form_area_placeholder" placeholder="เช่น 8" />
      <p class="field-error" data-i18n="form_error_number">กรุณากรอกตัวเลขที่มากกว่า 0</p>
    </div>

    <div class="form-footer">
      <button type="submit" class="btn-primary" id="submitBtn" data-i18n="form_next">ต่อไป</button>
    </div>
  </form>
</div>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="home" href="index.html">

    <span data-i18n="nav_input">กรอกข้อมูล</span>
  </a>
  <a class="nav-item" data-nav="compare" href="compare.html">

    <span data-i18n="nav_compare">เปรียบเทียบ</span>
  </a>
  <a class="nav-item" data-nav="admin" href="result.html">

    <span data-i18n="nav_admin">รายงาน</span>
  </a>
</nav>

</body>
</html>
